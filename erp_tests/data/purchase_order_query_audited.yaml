- baseInfo:
    api_name: ERP 查询已审核采购订单
    environment: erp_envi
    url: /depotHead/list
    method: GET
    header:
      X-Access-Token: ${get_extract_data(erp_access_token)}
  testCase:
    - case_name: 审核后采购订单状态正确
      params:
        search: '{"type":"其它","subType":"采购订单","number":"${get_extract_data(erp_purchase_order_number)}"}'
        currentPage: 1
        pageSize: 10
      validation:
        - eq: { 'code': 200 }
        - contains: { 'number': '${get_extract_data(erp_purchase_order_number)}' }
        - contains: { 'status': '1' }
