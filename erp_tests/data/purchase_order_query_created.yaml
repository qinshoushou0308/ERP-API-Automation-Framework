- baseInfo:
    api_name: ERP 查询新建采购订单
    environment: erp_envi
    url: /depotHead/list
    method: GET
    header:
      X-Access-Token: ${get_extract_data(erp_access_token)}
  testCase:
    - case_name: 新建采购订单处于未审核状态
      params:
        search: '{"type":"其它","subType":"采购订单","number":"CGDD${get_extract_data(erp_order_suffix)}"}'
        currentPage: 1
        pageSize: 10
      validation:
        - eq: { 'code': 200 }
        - contains: { 'number': 'CGDD${get_extract_data(erp_order_suffix)}' }
        - contains: { 'status': '0' }
      extract:
        erp_purchase_order_id: $.data.rows[0].id
        erp_purchase_order_number: $.data.rows[0].number
