- baseInfo:
    api_name: ERP 查询新建采购入库单
    environment: erp_envi
    url: /depotHead/list
    method: GET
    header:
      X-Access-Token: ${get_extract_data(erp_access_token)}
  testCase:
    - case_name: 采购入库单正确关联采购订单
      params:
        search: '{"type":"入库","subType":"采购","number":"CGRK${get_extract_data(erp_receipt_suffix)}"}'
        currentPage: 1
        pageSize: 10
      validation:
        - eq: { 'code': 200 }
        - contains: { 'number': 'CGRK${get_extract_data(erp_receipt_suffix)}' }
        - contains: { 'linkNumber': '${get_extract_data(erp_purchase_order_number)}' }
        - contains: { 'status': '0' }
      extract:
        erp_purchase_receipt_id: $.data.rows[0].id
        erp_purchase_receipt_number: $.data.rows[0].number
