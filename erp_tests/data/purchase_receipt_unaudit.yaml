- baseInfo:
    api_name: ERP 反审核采购入库单
    environment: erp_envi
    url: /depotHead/batchSetStatus
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(erp_access_token)}
  testCase:
    - case_name: 清理前将采购入库单恢复为未审核
      json:
        status: '0'
        ids: ${get_extract_data(erp_purchase_receipt_id)}
      validation:
        - eq: { 'code': 200 }
