- baseInfo:
    api_name: ERP 采购订单查询
    environment: erp_envi
    url: /depotHead/list
    method: GET
    header:
      X-Access-Token: ${get_extract_data(erp_access_token)}
  testCase:
    - case_name: 按单据编号查询已完成采购订单
      params:
        search: '{"type":"其它","subType":"采购订单","number":"CGDD00000000673"}'
        currentPage: 1
        pageSize: 10
      validation:
        - eq: { 'code': 200 }
        - contains: { 'number': 'CGDD00000000673' }
        - contains: { 'status': '2' }
