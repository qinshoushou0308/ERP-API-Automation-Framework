name: ERP Regression

on:
  workflow_dispatch:
    inputs:
      suite:
        description: ERP test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - regression
          - negative
          - inventory

permissions:
  contents: read

concurrency:
  group: erp-regression
  cancel-in-progress: false

jobs:
  purchase-flow:
    name: Purchase and inventory regression
    runs-on: [self-hosted, Windows, X64, erp-local]
    timeout-minutes: 20
    env:
      UV_NO_MANAGED_PYTHON: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check local ERP service
        shell: pwsh
        run: |
          $connection = Test-NetConnection 127.0.0.1 -Port 9999 -WarningAction SilentlyContinue
          if (-not $connection.TcpTestSucceeded) {
            throw "ERP service is not listening on 127.0.0.1:9999"
          }

      - name: Run all ERP tests
        if: inputs.suite == 'all'
        run: >-
          uv run --frozen --no-sync pytest -q
          ./erp_tests
          --alluredir=./report/ci-erp-allure-results
          --clean-alluredir

      - name: Run selected ERP tests
        if: inputs.suite != 'all'
        run: >-
          uv run --frozen --no-sync pytest -q
          ./erp_tests
          -m "${{ inputs.suite }}"
          --alluredir=./report/ci-erp-allure-results
          --clean-alluredir

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: erp-${{ inputs.suite }}-${{ github.run_number }}
          path: report/ci-erp-allure-results
          if-no-files-found: warn
          retention-days: 14
