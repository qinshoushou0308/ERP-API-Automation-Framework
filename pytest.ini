[pytest]
;addopts = -vs --alluredir ./report/temp -p no:warnings --clean-alluredir
;
;testpaths = ./testcase/

filterwarnings =
    error
    ignore::UserWarning

markers =
    erp: ERP API tests that require the locally deployed ERP service
    smoke: fast checks for login and read-only core APIs
    regression: complete ERP business-flow regression tests
    negative: invalid-operation and business-rule tests
    inventory: inventory-changing business-flow tests
    p0: highest-priority tests for release blocking paths
    p1: important tests for core and exception paths
    p2: supplementary tests for lower-risk paths

python_files = test_*.py

python_classes = Test*

python_functions = test
